            fi
          done < <(find . -type f \( -name settings.gradle -o -name settings.gradle.kts \) -not -path './.git/*' -not -path '*/.gradle/*' | sort)
          if [ -z "$ROOT" ]; then
            echo '::error::Could not locate an Android project root containing settings.gradle and app/build.gradle.'
